name: Incidencia
description: Algo falla o no se comporta como debería
title: "fix: "
labels: ["tipo: corrección"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué has visto y dónde. Si hay un error, pega el mensaje.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Pasos, comando o ejecución de Actions donde se ve.
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Pruebas
        - Develop
        - Staging
        - Producción
        - No aplica
    validations:
      required: true
  - type: markdown
    attributes:
      value: "No pegues contraseñas, tokens ni claves. Si el problema es de seguridad, no abras una issue: avisa al equipo de infraestructura."
